services:
  mind:
    build: ./mind-web
    ports:
      - "3000:3000"
    environment:
      MIND_DADOS: /data
      MIND_LLM_BASE_URL: ${MIND_LLM_BASE_URL:-}
      MIND_LLM_API_KEY: ${MIND_LLM_API_KEY:-}
      MIND_LLM_MODEL: ${MIND_LLM_MODEL:-claude-haiku-4-5}
    volumes:
      # Monta o repositório (grafo/ memoria/ permissoes/) como dados — leitura.
      - ./grafo:/data/grafo:ro
      - ./memoria:/data/memoria:ro
      - ./permissoes:/data/permissoes:ro
